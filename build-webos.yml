name: Build TvMad-Xtream webOS Beta IPK

on:
  workflow_dispatch:
  push:

permissions:
  contents: read

jobs:
  build-webos:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install webOS CLI
        run: npm install -g @webos-tools/cli

      - name: Locate and unpack TvMad-Xtream project
        shell: bash
        run: |
          set -euxo pipefail

          ZIP="TvMad-Xtream_webOS_Beta_0.1_PROJECT.zip"

          echo "Repository root:"
          ls -lah

          test -f "$ZIP"

          rm -rf build-src dist
          mkdir -p build-src dist
          unzip -q "$ZIP" -d build-src

          echo "Unpacked project:"
          find build-src -maxdepth 5 -type f -print | sort

      - name: Validate project
        shell: bash
        run: |
          set -euxo pipefail

          test -f build-src/app/appinfo.json
          test -f build-src/app/index.html
          test -f build-src/app/js/app.js
          test -f build-src/app/css/app.css

          SERVICE="build-src/services/pl.tvmad.app.xtream.service"
          test -f "$SERVICE/services.json"
          test -f "$SERVICE/service.js"
          test -f "$SERVICE/package.json"

          node -e "const a=require('./build-src/app/appinfo.json'); if(a.id!=='pl.tvmad.app.xtream') process.exit(1)"
          node -e "const s=require('./build-src/services/pl.tvmad.app.xtream.service/services.json'); if(s.id!=='pl.tvmad.app.xtream.service') process.exit(1)"

      - name: Install WebInfo service dependencies
        working-directory: build-src/services/pl.tvmad.app.xtream.service
        run: npm install --omit=dev --ignore-scripts

      - name: Build webOS IPK
        shell: bash
        run: |
          set -euxo pipefail

          ares-package \
            build-src/app \
            build-src/services/pl.tvmad.app.xtream.service \
            -o dist

          echo "Built packages:"
          ls -lah dist

          IPK="$(find dist -maxdepth 1 -type f -name '*.ipk' -print -quit)"
          test -n "$IPK"
          test -s "$IPK"

      - name: Upload IPK artifact
        uses: actions/upload-artifact@v4
        with:
          name: TvMad-Xtream_webOS_Beta_0.1_IPK
          path: dist/*.ipk
          if-no-files-found: error
